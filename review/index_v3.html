<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhyMetric · QA Review</title>
<style>
:root {
  --bg: #f4f4f0;
  --surface: #ffffff;
  --border: #e2e2d8;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #999;
  --accent: #2563eb;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #d97706;
  --sidebar-w: 290px;
  --header-h: 54px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
}

/* ── header ─────────────────────────────────────── */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px;
  z-index: 100;
}
.header-brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
.header-search input {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  background: var(--bg);
  width: 220px;
  outline: none;
}
.header-search input:focus { border-color: var(--accent); background: #fff; }

.stats { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-2); }
.stat-item { display: flex; align-items: center; gap: 5px; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-approved { background: var(--green); }
.dot-flagged  { background: var(--orange); }
.dot-pending  { background: #94a3b8; }
.progress-bar {
  height: 4px; width: 120px; background: #e5e7eb; border-radius: 2px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s; }

.header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.save-badge { font-size: 11px; color: var(--text-3); min-width: 60px; text-align: right; }
.save-badge.saving { color: var(--accent); }
.save-badge.saved  { color: var(--green); }

/* ── layout ─────────────────────────────────────── */
.layout {
  display: flex;
  height: 100vh;
  padding-top: var(--header-h);
}

/* ── sidebar ─────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-filters {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 4px;
}
.flt {
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-2);
}
.flt.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sidebar-tree { flex: 1; overflow-y: auto; }

.cat-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px;
  cursor: pointer;
  font-size: 11px; font-weight: 700;
  color: var(--text-2);
  user-select: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 0; z-index: 1;
}
.cat-header:hover { background: #ebebeb; }
.cat-arrow { font-size: 9px; transition: transform 0.15s; }
.cat-header.collapsed .cat-arrow { transform: rotate(-90deg); }
.cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-badge {
  font-size: 10px; font-weight: 500;
  padding: 1px 6px; border-radius: 10px;
  background: #e0e7ff; color: #3730a3;
}
.cat-badge.done { background: #dcfce7; color: #166534; }

.scene-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 10px 6px 20px;
  cursor: pointer;
  font-size: 12px;
  border-left: 2px solid transparent;
  line-height: 1.35;
}
.scene-item:hover { background: var(--bg); }
.scene-item.active {
  background: #eff6ff;
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sid { font-size: 10px; color: var(--text-3); flex-shrink: 0; }

/* ── main content ────────────────────────────────── */
.content { flex: 1; overflow-y: auto; padding: 20px 24px 60px; }

.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.breadcrumb { font-size: 13px; color: var(--text-2); flex: 1; }
.breadcrumb b { color: var(--text); }
.nav-pos { font-size: 12px; color: var(--text-3); }

.status-badge {
  font-size: 12px; font-weight: 600;
  padding: 4px 11px; border-radius: 20px;
}
.status-badge.pending  { background: #f1f5f9; color: #64748b; }
.status-badge.approved { background: #dcfce7; color: #166534; }
.status-badge.flagged  { background: #fff7ed; color: #c2410c; }

/* buttons */
.btn {
  padding: 6px 13px;
  border-radius: 6px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: background 0.12s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg); }
.btn-approve { background: var(--green);  color: #fff; border-color: var(--green); }
.btn-approve:hover { opacity: 0.88; background: var(--green); }
.btn-flag    { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-flag:hover { opacity: 0.88; background: var(--orange); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { opacity: 0.88; background: var(--accent); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 11px; font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.6px;
  margin-bottom: 14px;
}

/* fields */
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
.finput {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.12s;
}
.ftextarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  resize: vertical;
  min-height: 68px;
  transition: border-color 0.12s;
}
.finput:focus, .ftextarea:focus {
  border-color: var(--accent);
  background: #fff;
}

/* questions */
.q-grid { display: flex; flex-direction: column; gap: 10px; }
.q-card {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  background: var(--bg);
}
.q-head { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.q-num { font-weight: 700; font-size: 13px; margin-right: 2px; }
.tag {
  font-size: 10px; font-weight: 600;
  padding: 2px 6px; border-radius: 3px;
  background: #e0e7ff; color: #3730a3;
}
.tag.easy   { background: #dcfce7; color: #166534; }
.tag.medium { background: #fef9c3; color: #854d0e; }
.tag.hard   { background: #fee2e2; color: #991b1b; }

.q-input {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  min-height: 44px;
  background: #fff;
  outline: none;
}
.q-input:focus { border-color: var(--accent); }

.answer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.answer-label { font-size: 12px; color: var(--text-2); }
.answer-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.abtn {
  padding: 4px 14px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  border: none;
  background: var(--surface);
  color: var(--text-3);
  transition: all 0.12s;
}
.abtn:hover { background: var(--bg); }
.abtn.yes { background: var(--green); color: #fff; }
.abtn.no  { background: var(--red);   color: #fff; }

/* keyboard hint */
.keys { font-size: 11px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.kbd {
  font-size: 10px; padding: 1px 5px;
  background: #f1f5f9; border: 1px solid #cbd5e1;
  border-radius: 3px; font-family: monospace;
}

/* empty / loading */
.empty { text-align: center; padding: 80px; color: var(--text-3); font-size: 14px; }

/* scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #bbb; }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">PhyMetric · QA Review</div>
  <div class="header-search">
    <input type="text" id="searchInput" placeholder="🔍  Search category / scene…" />
  </div>
  <div class="stats">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stat-item"><div class="stat-dot dot-approved"></div><span id="sApproved">0</span></div>
    <div class="stat-item"><div class="stat-dot dot-flagged"></div><span id="sFlagged">0</span></div>
    <div class="stat-item"><div class="stat-dot dot-pending"></div><span id="sPending">0</span> / <span id="sTotal">0</span></div>
  </div>
  <div class="header-right">
    <span class="save-badge" id="saveBadge"></span>
    <button class="btn btn-sm" onclick="exportData()">↓ Export JSON</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-filters">
      <button class="flt active" onclick="setFilter('all',this)">All</button>
      <button class="flt" onclick="setFilter('pending',this)">Pending</button>
      <button class="flt" onclick="setFilter('approved',this)">Approved</button>
      <button class="flt" onclick="setFilter('flagged',this)">Flagged</button>
    </div>
    <div class="sidebar-tree" id="sidebarTree"></div>
  </nav>

  <!-- MAIN -->
  <main class="content" id="mainContent">
    <div class="empty">Loading…</div>
  </main>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────
const S = {
  data: null,
  records: {},
  allScenes: [],      // [{cat, sceneId, sceneName, idx}]
  visible: [],        // filtered subset
  currentIdx: -1,
  filter: 'all',
  query: '',
  collapseState: {},  // cat -> bool
  saveTimer: null,
};

const statusColor = { pending: '#94a3b8', approved: '#16a34a', flagged: '#d97706' };
const statusLabel = { pending: '○ Pending', approved: '✓ Approved', flagged: '⚑ Flagged' };

// ── bootstrap ─────────────────────────────────────────────────────────────
async function init() {
  try {
    const [data, records] = await Promise.all([
      fetch('/api/data').then(r => r.json()),
      fetch('/api/records').then(r => r.json()),
    ]);
    S.data = data;
    S.records = records;

    let idx = 0;
    for (const [cat, catData] of Object.entries(data.categories)) {
      for (const [sceneId, scene] of Object.entries(catData.scenes)) {
        S.allScenes.push({ cat, sceneId, sceneName: scene.scene_name, idx });
        idx++;
      }
    }

    refreshVisible();
    renderSidebar();
    updateStats();
    if (S.allScenes.length > 0) navigateTo(0);
  } catch (e) {
    document.getElementById('mainContent').innerHTML =
      `<div class="empty">❌ Error: ${e.message}</div>`;
  }
}

// ── helpers ───────────────────────────────────────────────────────────────
const key = (cat, sid) => `${cat}::${sid}`;

function getRec(cat, sid) {
  return S.records[key(cat, sid)] || { status: 'pending', edits: {}, notes: '' };
}

function refreshVisible() {
  const q = S.query.toLowerCase();
  S.visible = S.allScenes.filter(s => {
    if (q) {
      const hay = (s.cat + ' ' + s.sceneId + ' ' + s.sceneName).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (S.filter !== 'all' && getRec(s.cat, s.sceneId).status !== S.filter) return false;
    return true;
  });
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function autoH(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

// ── sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
  if (!S.data) return;

  // Build cat -> visible scenes map
  const bycat = {};
  for (const s of S.visible) {
    (bycat[s.cat] = bycat[s.cat] || []).push(s);
  }

  let html = '';
  for (const cat of Object.keys(S.data.categories)) {
    const scenes = bycat[cat];
    if (!scenes?.length && (S.query || S.filter !== 'all')) continue;
    const list = scenes || [];

    const totalCat = Object.keys(S.data.categories[cat].scenes).length;
    const approvedCat = list.filter(s => getRec(s.cat, s.sceneId).status === 'approved').length;
    const donePct = totalCat ? Math.round(approvedCat / totalCat * 100) : 0;
    const badgeCls = approvedCat === totalCat && totalCat > 0 ? 'done' : '';

    const collapsed = S.collapseState[cat] && !S.query;
    html += `<div>
      <div class="cat-header ${collapsed ? 'collapsed' : ''}" onclick="toggleCat('${cat}')">
        <span class="cat-arrow">▾</span>
        <span class="cat-name">${esc(cat.replace(/_/g,' '))}</span>
        <span class="cat-badge ${badgeCls}">${approvedCat}/${S.query || S.filter !== 'all' ? list.length : totalCat}</span>
      </div>`;
    if (!collapsed) {
      for (const s of list) {
        const rec = getRec(s.cat, s.sceneId);
        const act = s.idx === S.currentIdx ? 'active' : '';
        html += `<div class="scene-item ${act}" data-idx="${s.idx}" onclick="navigateTo(${s.idx})">
          <div class="sdot" style="background:${statusColor[rec.status] || statusColor.pending}"></div>
          <span class="sname" title="${esc(s.sceneName)}">${esc(s.sceneName)}</span>
        </div>`;
      }
    }
    html += '</div>';
  }
  if (!html) html = '<div style="padding:20px;font-size:12px;color:#999;text-align:center">No results</div>';
  document.getElementById('sidebarTree').innerHTML = html;
}

function toggleCat(cat) {
  S.collapseState[cat] = !S.collapseState[cat];
  renderSidebar();
}

// ── stats ─────────────────────────────────────────────────────────────────
function updateStats() {
  let approved = 0, flagged = 0;
  const total = S.allScenes.length;
  for (const s of S.allScenes) {
    const st = getRec(s.cat, s.sceneId).status;
    if (st === 'approved') approved++;
    else if (st === 'flagged') flagged++;
  }
  const pending = total - approved - flagged;
  document.getElementById('sApproved').textContent = approved;
  document.getElementById('sFlagged').textContent = flagged;
  document.getElementById('sPending').textContent = pending;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('progressFill').style.width =
    total ? Math.round(approved / total * 100) + '%' : '0%';
}

// ── navigation ────────────────────────────────────────────────────────────
function navigateTo(idx) {
  S.currentIdx = idx;
  const s = S.allScenes[idx];
  if (!s) return;
  renderScene(s.cat, s.sceneId);
  renderSidebar();
  setTimeout(() => {
    document.querySelector(`.scene-item[data-idx="${idx}"]`)?.scrollIntoView({ block: 'nearest' });
  }, 30);
}

function navVisible(dir) {
  const vi = S.visible.findIndex(s => s.idx === S.currentIdx);
  const next = S.visible[vi + dir];
  if (next) navigateTo(next.idx);
}

// ── scene render ──────────────────────────────────────────────────────────
function renderScene(cat, sid) {
  const scene = S.data.categories[cat].scenes[sid];
  const rec = getRec(cat, sid);
  const edits = rec.edits || {};

  // Overlay edits on originals
  const name    = edits.scene_name        ?? scene.scene_name;
  const caption = edits.scene_caption     ?? scene.scene_caption;
  const prompt  = edits.generation_prompt ?? scene.generation_prompt;
  const causal  = { ...scene.causal_chain, ...(edits.causal_chain || {}) };
  const qs      = edits.questions ? edits.questions : scene.questions.map(q => ({...q}));

  const vi = S.visible.findIndex(s => s.idx === S.currentIdx);
  const st = rec.status || 'pending';

  document.getElementById('mainContent').innerHTML = `
    <!-- breadcrumb + nav -->
    <div class="toolbar">
      <div class="breadcrumb">${esc(cat.replace(/_/g,' '))} › <b>${esc(sid)}</b></div>
      <div class="nav-pos">${vi >= 0 ? vi+1 : '—'} / ${S.visible.length}</div>
    </div>

    <!-- action bar -->
    <div class="toolbar" style="margin-bottom:18px">
      <span class="status-badge ${st}" id="statusBadge">${statusLabel[st]}</span>
      <button class="btn btn-approve" onclick="setStatus('approved')">✓ Approve</button>
      <button class="btn btn-flag"    onclick="setStatus('flagged')">⚑ Flag</button>
      <button class="btn btn-sm"      onclick="setStatus('pending')">Reset</button>
      <div style="flex:1"></div>
      <div class="keys">
        <span><span class="kbd">A</span> approve</span>
        <span><span class="kbd">F</span> flag</span>
        <span><span class="kbd">Enter</span> approve+next</span>
        <span><span class="kbd">J/K</span> nav</span>
      </div>
      <button class="btn" onclick="navVisible(-1)">← Prev</button>
      <button class="btn btn-primary" onclick="approveNext()">Approve & Next →</button>
      <button class="btn" onclick="navVisible(1)">Next →</button>
    </div>

    <!-- scene info -->
    <div class="card">
      <div class="card-title">Scene Info</div>
      <div class="field">
        <div class="field-label">Scene Name</div>
        <input class="finput" data-f="scene_name" value="${esc(name)}" oninput="onFieldEdit(this)" />
      </div>
      <div class="field">
        <div class="field-label">Caption</div>
        <textarea class="ftextarea" data-f="scene_caption" oninput="onFieldEdit(this)">${esc(caption)}</textarea>
      </div>
      <div class="field">
        <div class="field-label">Generation Prompt</div>
        <textarea class="ftextarea" data-f="generation_prompt" oninput="onFieldEdit(this)" style="min-height:80px">${esc(prompt)}</textarea>
      </div>
    </div>

    <!-- causal chain -->
    <div class="card">
      <div class="card-title">Causal Chain</div>
      <div class="field">
        <div class="field-label">Initial State</div>
        <textarea class="ftextarea" data-c="initial_state" oninput="onChainEdit(this)">${esc(causal.initial_state||'')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">Process</div>
        <textarea class="ftextarea" data-c="process" oninput="onChainEdit(this)">${esc(causal.process||'')}</textarea>
      </div>
      <div class="field">
        <div class="field-label">Final State</div>
        <textarea class="ftextarea" data-c="final_state" oninput="onChainEdit(this)">${esc(causal.final_state||'')}</textarea>
      </div>
    </div>

    <!-- questions -->
    <div class="card">
      <div class="card-title">Questions (${qs.length})</div>
      <div class="q-grid">
        ${qs.map((q, i) => qCard(q, i)).join('')}
      </div>
    </div>

    <!-- notes -->
    <div class="card" style="margin-bottom:40px">
      <div class="card-title">Reviewer Notes</div>
      <textarea class="ftextarea" placeholder="Add notes…" oninput="onNotesEdit(this)" style="min-height:56px">${esc(rec.notes||'')}</textarea>
    </div>
  `;

  document.querySelectorAll('textarea').forEach(autoH);
}

function qCard(q, i) {
  const dims = (q.dimensions || []).map(d => `<span class="tag">${esc(d)}</span>`).join('');
  const yc = q.answer === 1 ? 'yes' : '';
  const nc = q.answer === 0 ? 'no'  : '';
  return `<div class="q-card" id="qc${i}">
    <div class="q-head">
      <span class="q-num">Q${parseInt(q.id)}</span>
      <span class="tag ${q.difficulty}">${q.difficulty}</span>
      ${dims}
    </div>
    <textarea class="q-input" data-qi="${i}" oninput="onQEdit(this)">${esc(q.question_text)}</textarea>
    <div class="answer-row">
      <span class="answer-label">Answer:</span>
      <div class="answer-toggle">
        <button class="abtn ${yc}" onclick="setAnswer(${i},1)">YES</button>
        <button class="abtn ${nc}" onclick="setAnswer(${i},0)">NO</button>
      </div>
    </div>
  </div>`;
}

// ── edit handlers ─────────────────────────────────────────────────────────
function curState() {
  const s = S.allScenes[S.currentIdx];
  const k = key(s.cat, s.sceneId);
  if (!S.records[k]) S.records[k] = { status: 'pending', edits: {}, notes: '' };
  return { ...s, k, rec: S.records[k], scene: S.data.categories[s.cat].scenes[s.sceneId] };
}

function onFieldEdit(el) {
  autoH(el);
  const { rec } = curState();
  if (!rec.edits) rec.edits = {};
  rec.edits[el.dataset.f] = el.value;
  scheduleSave();
}

function onChainEdit(el) {
  autoH(el);
  const { rec, scene } = curState();
  if (!rec.edits) rec.edits = {};
  if (!rec.edits.causal_chain) rec.edits.causal_chain = { ...scene.causal_chain };
  rec.edits.causal_chain[el.dataset.c] = el.value;
  scheduleSave();
}

function ensureQEdits() {
  const { rec, scene } = curState();
  if (!rec.edits) rec.edits = {};
  if (!rec.edits.questions) rec.edits.questions = scene.questions.map(q => ({...q}));
}

function onQEdit(el) {
  autoH(el);
  ensureQEdits();
  const { rec } = curState();
  rec.edits.questions[+el.dataset.qi].question_text = el.value;
  scheduleSave();
}

function setAnswer(qi, val) {
  ensureQEdits();
  const { rec } = curState();
  rec.edits.questions[qi].answer = val;
  const card = document.getElementById('qc' + qi);
  card.querySelector('.abtn:first-child').className = `abtn ${val === 1 ? 'yes' : ''}`;
  card.querySelector('.abtn:last-child').className  = `abtn ${val === 0 ? 'no'  : ''}`;
  scheduleSave();
}

function onNotesEdit(el) {
  const { rec } = curState();
  rec.notes = el.value;
  scheduleSave();
}

// ── status ────────────────────────────────────────────────────────────────
function setStatus(st) {
  const { rec, k } = curState();
  rec.status = st;
  rec.reviewed_at = new Date().toISOString();
  scheduleSave();

  const badge = document.getElementById('statusBadge');
  if (badge) { badge.className = `status-badge ${st}`; badge.textContent = statusLabel[st]; }

  updateStats();
  // Update dot in sidebar without full re-render
  const dot = document.querySelector(`.scene-item[data-idx="${S.currentIdx}"] .sdot`);
  if (dot) dot.style.background = statusColor[st] || statusColor.pending;
  // Update cat badge
  renderSidebar();
}

function approveNext() { setStatus('approved'); navVisible(1); }

// ── save ──────────────────────────────────────────────────────────────────
function scheduleSave() {
  setSaveBadge('saving', 'Saving…');
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(flushSave, 900);
}

async function flushSave() {
  const { k, rec } = curState();
  try {
    await fetch('/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: k, record: rec }),
    });
    setSaveBadge('saved', 'Saved ✓');
    setTimeout(() => setSaveBadge('', ''), 2000);
  } catch {
    setSaveBadge('', 'Save failed!');
  }
}

function setSaveBadge(cls, txt) {
  const el = document.getElementById('saveBadge');
  el.className = 'save-badge ' + cls;
  el.textContent = txt;
}

// ── filter / search ───────────────────────────────────────────────────────
function setFilter(f, btn) {
  S.filter = f;
  document.querySelectorAll('.flt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  refreshVisible(); renderSidebar();
}

document.getElementById('searchInput').addEventListener('input', function() {
  S.query = this.value.trim();
  refreshVisible(); renderSidebar();
});

// ── export ────────────────────────────────────────────────────────────────
async function exportData() {
  const res  = await fetch('/api/export');
  const blob = await res.blob();
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `question_v3_reviewed_${new Date().toISOString().slice(0,10)}.json`,
  });
  a.click();
  URL.revokeObjectURL(url);
}

// ── keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'j' || e.key === 'ArrowDown')  navVisible(1);
  if (e.key === 'k' || e.key === 'ArrowUp')    navVisible(-1);
  if (e.key === 'a') setStatus('approved');
  if (e.key === 'f') setStatus('flagged');
  if (e.key === 'Enter') approveNext();
});

// ── start ─────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
